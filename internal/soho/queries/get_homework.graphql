# Чтение контекста и сообщений, живой API пока не проверен
query GetHomeworkBundle($id: ID!, $limit: Int!) {
  chat: node(id: $id) {
    __typename
    ... on Chat {
      id
      uid
      title
      lastUpdated
      chatPeer {
        __typename
        ... on ChatPeerHomework {
          student {
            __typename
            ... on ChatPeerUser { name }
            ... on ChatPeerOrg { name }
          }
        }
      }
      teachers: participants(roles: [Teacher, HeadTeacher]) {
        id
        user { id authUserId }
      }
      students: participants(roles: [Partner]) {
        id
        user { id authUserId }
      }
      studentHomework {
        id
        uid
        academicHomeworkId
        deadlineAt
        progressStatus
        mergedStatus
        attempt
        gradingScale
        grade
        scores
        gradeOrScoresMaxAchievable
        academicHomework {
          id
          kind
          detailsSimple {
            isGradable
            isInline
          }
        }
      }
      messagesNew(last: $limit) {
        pageInfo {
          hasPreviousPage
          hasNextPage
          startCursor
          endCursor
        }
        edges {
          cursor
          node {
            id
            uid
            chatId
            messageType
            text
            metaInfo
            isWysiwyg
            timeCreated
            userCreated { id uid name authUserId }
            quoteMessageId
            threadMessageId
            visibility
            status
            imageAnnotations {
              sourceMessageId
              sourceImageUrl
              bakedImage { url width height }
              previewImage { url width height }
              hasDrawing
              hasAreas
            }
          }
        }
      }
    }
  }
}
