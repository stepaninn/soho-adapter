name: Windows package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Parse setup window
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scriptPath = Join-Path $PWD 'cmd/soho-setup/setup.ps1'
          # ParseFile uses the Windows code page for UTF-8 files without a BOM.
          $source = [System.IO.File]::ReadAllText($scriptPath, [System.Text.Encoding]::UTF8)
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseInput($source, $scriptPath, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Format-List Message, Extent | Out-String) }
      - name: Build package
        run: go run ./cmd/package-windows
      - name: Check setup window and installation without SOHO access
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('soho-test-' + [Guid]::NewGuid())
          Expand-Archive dist/soho-windows-amd64.zip -DestinationPath $sandbox
          $env:USERPROFILE = Join-Path $sandbox 'user'
          $env:LOCALAPPDATA = Join-Path $sandbox 'local'
          $env:CODEX_HOME = Join-Path $sandbox 'codex'
          $setup = Join-Path $sandbox 'SOHO Review/SOHO-Setup.exe'
          $launcher = Start-Process -FilePath $setup -PassThru
          $window = $null
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(30)
            do {
              if ($launcher.HasExited) { throw "Setup exited before showing a window ($($launcher.ExitCode))" }
              $child = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($launcher.Id) AND Name = 'powershell.exe'" | Select-Object -First 1
              if ($child) {
                $window = Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
                if ($window -and $window.MainWindowHandle -ne 0 -and $window.MainWindowTitle -like 'SOHO *') { break }
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $window -or $window.MainWindowHandle -eq 0 -or $window.MainWindowTitle -notlike 'SOHO *') {
              throw 'The setup window did not become visible'
            }
            if (-not $window.CloseMainWindow() -or -not $launcher.WaitForExit(5000) -or $launcher.ExitCode -ne 0) {
              throw 'Setup did not exit cleanly after closing the window'
            }
          } finally {
            if ($window -and -not $window.HasExited) { $window.Kill() }
            if (-not $launcher.HasExited) { $launcher.Kill() }
          }
          function Install-Fixture([string]$phase, [string]$json) {
            $utf8 = New-Object System.Text.UTF8Encoding($false)
            $info = New-Object System.Diagnostics.ProcessStartInfo
            $info.FileName = $setup
            $info.Arguments = '--install'
            $info.UseShellExecute = $false
            $info.RedirectStandardInput = $true
            $info.RedirectStandardOutput = $true
            $info.StandardOutputEncoding = $utf8
            $process = [System.Diagnostics.Process]::Start($info)
            try {
              # Match setup.ps1 and send JSON as raw UTF-8 without a BOM.
              $inputStream = $process.StandardInput.BaseStream
              try {
                $inputBytes = $utf8.GetBytes($json)
                $inputStream.Write($inputBytes, 0, $inputBytes.Length)
              } finally {
                $inputStream.Dispose()
              }
              $output = $process.StandardOutput.ReadToEnd()
              $process.WaitForExit()
              if (-not $output) { throw "Installer $phase returned no response (exit $($process.ExitCode))" }
              $result = $output | ConvertFrom-Json
              if ($process.ExitCode -ne 0 -or -not $result.OK) {
                throw "Installer $phase failed (exit $($process.ExitCode)): $($result.Message)"
              }
              return $result
            } finally {
              $process.Dispose()
            }
          }
          $first = Install-Fixture 'initial install' '{"Login":"test-login","Password":"test-password"}'
          [System.IO.File]::WriteAllText($first.Paths.Skill, 'Custom review rules')
          $second = Install-Fixture 'update' '{}'
          if ([System.IO.File]::ReadAllText($second.Paths.Skill) -ne 'Custom review rules') { throw 'User skill overwritten' }
          if (-not (Test-Path $second.Paths.Config)) { throw 'MCP config missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: soho-windows-amd64
          path: |
            dist/soho-windows-amd64.zip
            dist/soho-windows-amd64.zip.sha256
